<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Do You Still Love Me? 💖</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="card" id="cardContainer">
    <div class="heart-icon">💖</div>
    <h1>Do you still love me? 🥺</h1>
    <p class="subtitle">Please answer honestly... 👉👈</p>

    <div class="btn-group">
      <button id="yesBtn">Yes! 🥰</button>
      <button id="noBtn">No 😢</button>
    </div>
  </div>

  <!-- Success Modal Overlay -->
  <div id="successModal" class="modal">
    <div class="modal-content">
      <h2>I knew it! Yaaay! 🎉🥰❤️</h2>
      <p>You made my heart skip a beat! I love you so much! 💕✨</p>
      <button id="closeBtn">Send a Virtual Hug 🤗</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
